.pnm{font-style:normal;font-weight:600;font-size:.88em;opacity:.95;margin-left:.6em;letter-spacing:.02em;color:var(--gold,#e9c46a)}
.tools{display:flex;align-items:center;gap:.4rem}
.tools .tbtns{display:flex;align-items:center;gap:.5rem;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;pointer-events:none;transition:max-width .25s ease .6s,opacity .2s ease .6s}
.tools:hover .tbtns,.tools.open .tbtns{max-width:40rem;opacity:1;pointer-events:auto;transition-delay:0s}
.tlt{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem!important;font-weight:700;letter-spacing:.06em;line-height:1;padding:.4rem .75rem!important;border-radius:.7rem!important;color:var(--gold)!important;border:.12rem solid var(--gold)!important;background:rgba(233,196,106,.1)!important;opacity:.9;transition:background .2s,opacity .2s}
.tlt i{font-style:normal;font-size:1.35rem;line-height:.8;transition:transform .25s}
.tlt:hover{background:rgba(233,196,106,.25)!important;opacity:1}
.tools:hover .tlt i,.tools.open .tlt i{transform:rotate(180deg)}

.lbm{background:radial-gradient(ellipse at 50% -10%,#2a2160 0%,#0a0818 55%,#05030f 100%)}
.lbw{max-width:62rem;margin:0 auto;padding-bottom:2rem}
.lbh{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.lbh h2{font-family:var(--fs);letter-spacing:.2em;color:var(--gold);font-size:2rem;margin:0;font-weight:400}
.lbsub{color:var(--m);font-size:.95rem;margin-top:.35rem}
.lbsub b{color:var(--ag)}
.lbkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1.2rem 0}
.lbk{background:var(--p);border:1px solid #3a3566;border-top:.2rem solid var(--gold);border-radius:.8rem;padding:.7rem 1rem;text-align:center}
.lbk span{display:block;font-size:.68rem;letter-spacing:.16em;color:var(--m);text-transform:uppercase}
.lbk b{font-size:1.5rem;color:var(--t);font-weight:700}
.lbpods{display:flex;justify-content:center;align-items:flex-end;gap:.8rem;margin:1.6rem 0}
.lbpod{flex:1;max-width:17rem;text-align:center;border-radius:1rem 1rem .6rem .6rem;padding:.9rem .6rem 1rem;border:1px solid;background:linear-gradient(180deg,var(--c1),var(--p))}
.lbpod.p1{order:2;--c1:#5a4716;border-color:var(--gold);min-height:11.5rem;box-shadow:0 0 2rem #e9c46a33}
.lbpod.p2{order:1;--c1:#3a3e55;border-color:#c5ccdf;min-height:9.6rem}
.lbpod.p3{order:3;--c1:#4d3020;border-color:#cd8a52;min-height:8.6rem}
.lbmed{font-size:2rem;line-height:1}
.lbpn{font-weight:800;letter-spacing:.06em;margin:.4rem 0 .2rem;word-break:break-word}
.lbpp{font-family:var(--fs);font-size:2.2rem;color:var(--gold);line-height:1.1}
.lbpp small{font-size:.8rem;color:var(--m);margin-left:.3rem;font-family:var(--fb)}
.lbps{color:var(--m);font-size:.82rem;margin-top:.3rem}
.lbtab{background:var(--p);border:1px solid #3a3566;border-radius:.9rem;overflow:hidden}
.lbrow{display:grid;grid-template-columns:2.2rem minmax(6rem,10rem) 1fr 3rem repeat(5,3.5rem);align-items:center;gap:.6rem;padding:.5rem .9rem;border-left:.25rem solid transparent}
.lbrow.hd{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--m);background:#0f0d24;padding-top:.7rem;padding-bottom:.7rem}
.lbrow.hd .lbn{font-size:.68rem;color:var(--m)}
.lbrow:not(.hd):nth-child(even){background:#12102a}
.lbrow.r1{border-left-color:var(--gold)}.lbrow.r2{border-left-color:#c5ccdf}.lbrow.r3{border-left-color:#cd8a52}
.lbrow b{font-weight:800;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrk{color:var(--m);font-weight:700;text-align:center}
.lbbar{height:.7rem;border-radius:.4rem;background:#241f4b;overflow:hidden}
.lbbar i{display:block;height:100%;border-radius:.4rem;background:linear-gradient(90deg,#9a7120,var(--gold))}
.lbpt{color:var(--gold);font-weight:800;text-align:center;font-size:1.05rem}
.lbn{text-align:center;color:var(--t);font-size:.92rem}
.lbmsg{padding:2rem 1rem;text-align:center;color:var(--m)}
.lbwarn{background:#3a1d24;border:1px solid #7a3340;color:#ffb3a8;border-radius:.6rem;padding:.5rem .8rem;margin:.8rem 0;font-size:.9rem}
@media(max-width:720px){.lbrow{grid-template-columns:2rem 1fr 2.8rem 2.6rem 2.6rem}.lbbar,.lbx{display:none}.lbpods{gap:.4rem}.lbpp{font-size:1.7rem}.lbk b{font-size:1.2rem}}


@media(min-width:901px) and (max-width:999px){.tip-ticker{flex:0 1 28rem;margin-inline:auto}}
@media(min-width:1000px){.top{position:relative}.tip-ticker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);flex:none;width:min(26rem,31vw);margin:0}}
@media(min-width:1250px){.tip-ticker{width:26rem}}
.fpick{position:relative;max-width:46rem;margin:1.2rem auto 0;padding:1rem 1rem .9rem;border:.14rem dashed rgba(233,196,106,.55);border-radius:1.4rem;background:radial-gradient(ellipse at 50% 85%,rgba(255,255,255,.08),transparent 70%);cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:pan-y;outline:none;transition:border-color .2s,box-shadow .2s}
.fpick:hover,.fpick:focus-visible{border-color:var(--gold,#e9c46a);box-shadow:0 0 1.6rem rgba(255,255,255,.14)}
.fpcount{display:flex;align-items:baseline;justify-content:center;gap:.6rem}
.fpcount b{font-family:var(--fs);font-size:3.4rem;line-height:1;color:var(--gold,#e9c46a);display:inline-block}
.fpcount b.bump{animation:fpbump .3s ease}
@keyframes fpbump{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.fpcount span{font-size:1.1rem;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.fprow{display:flex;justify-content:center;align-items:flex-end;height:clamp(5.2rem,22vw,8rem);margin-top:.6rem;pointer-events:none}
.fl{position:relative;flex:1 1 0;max-width:8.5rem;height:100%;margin:0 -.7rem;opacity:0;transform:scale(.15) translateY(1.4rem) rotate(-16deg);transform-origin:50% 100%;transition:transform .38s cubic-bezier(.3,1.7,.5,1),opacity .18s ease}

const D=[{"n":"Affirmation of Divine Right","t":"Law","e":null,"x":"For: Mecatol Rex is a legendary planet. At the end of each strategy phase, each other player must give the player who controls Mecatol Rex 1 promissory note from their hand, if able.\n\nAgainst: Exhaust the Imperial strategy card. Place this card with the current laws and place the custodians token on it. The player who had the custodians token loses 1 victory point. While this law is in play with the custodians token on it, players cannot gain victory points from the Imperial strategy card for controlling Mecatol Rex. If this law is discarded, the player who controls Mecatol Rex gains the custodians token and 1 victory point."},{"n":"Anti-Intellectual Revolution","t":"Law","e":null,"x":"For: Each player who voted \"For\" or abstained returns 1 technology they own with the most prerequisites to their technology decks. Double the prerequisites on all technologies.\n\nAgainst: Exhaust the Technology strategy card. Any player who voted \"Against\" or abstained destroys a number of their units on the game board with a combined cost of at least 6 resources."},{"n":"Archived Secret","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player draws 2 secret objectives, then gives 1 promissory note from their hand to the other player who cast the most votes for them."},{"n":"Armed Forces Standardization","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player places command tokens from their reinforcements until they have 3 tokens in their tactic pool, 3 tokens in their fleet pool, and 2 tokens in their strategy pool. They return any excess tokens to their reinforcements, then the other player who cast the most votes for the elected player gives them 1 promissory note from their hand."},{"n":"Arms Reduction","t":"Directive","e":null,"x":"For: Each player destroys all of their dreadnoughts and half of their cruisers (rounding up). Players gain 2 trade goods for each dreadnought and 1 trade good for each cruiser destroyed this way. The player who cast the most votes \"For\" adds 1 command token from their reinforcements to their strategy pool.\n\nAgainst: The player who cast the most votes \"Against\" may research 1 unit upgrade technology, then place 1 dreadnought or 2 cruisers in a system that contains only their units."},{"n":"Articles of War","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 3 of their control tokens on this card. All mechs lose their printed abilities except for SUSTAIN DAMAGE. When any player activates a system, a player whose control token is on this card may discard 1 control token to ignore the effects of this law during that tactical action.\n\nAgainst: Players who voted \"For\" or abstained replace each of their mechs on the game board with an infantry from their reinforcements. The player who cast the most votes \"Against\" may place any number of mechs in their reinforcements on any planet or planets they control."},{"n":"Checks and Balances","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" places 1 of their control tokens on this card. When a player chooses a strategy card during the strategy phase, they give that strategy card to another player who does not have 1 (or a player who does not have 2, in a 3- or 4-player game), if able. If a player whose control token is on this card does not currently have a strategy card, they may discard that token to keep a chosen strategy card instead.\n\nAgainst: Remove all control tokens from public objectives and shuffle all scored secret objectives back into the deck.  Players do not gain or lose victory points as a result of this."},{"n":"Clandestine Operations","t":"Directive","e":null,"x":"For: The player who cast the most votes \"For\" gains 2 command tokens and takes the speaker token. Then, each player removes 1 command token from the command sheet of the player to their left and returns it to that player's reinforcements.\n\nAgainst: Each player removes 1 command token from their fleet pool.  Exhaust the Politics strategy card."},{"n":"Classified Document Leak","t":"Law","e":"Scored Secret Objective","x":"Elect scored secret objective.\n\nThe elected secret objective becomes a public objective. The player who cast the most votes for that objective may immediately score it, if they meet the requirements, or draw 2 action cards if they do not."},{"n":"Colonial Redistribution","t":"Directive","e":"Non-home, non-Rex planet","x":"Elect non-home planet other than Mecatol Rex.\n\nRemove each unit on the elected planet. The player who controls that planet places the removed units on 1 or more planets they control in their home system, if able, then chooses 1 other player with the fewest victory points; that player places 3 infantry from their reinforcements on the elected planet."},{"n":"Committee Formation","t":"Law","e":"Player","x":"Elect Player.\n\nThe elected player gains this card and gives each other player who voted for them 1 promissory note from their hand (in order of most votes to least), if able.\n\nBefore players vote on an agenda that requires a player to be elected, the owner of this card may discard this card to choose the player to be elected. Players do not vote on that agenda. The owner of this card is considered to have cast the most votes for the resolved outcome."},{"n":"Compensated Disarmament","t":"Directive","e":"Planet","x":"Elect planet.\n\nRemove each ground force on the elected planet; the player who controls that planet gains 1 trade good for each infantry removed and 2 trade goods for each mech removed.\n\nThe other player who cast the most votes for the elected planet gives the owner of the elected planet 1 promissory note from their hand."},{"n":"Conventions of War","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" gains 1 trade good for each of their cultural planets. Players cannot use BOMBARDMENT against cultural planets.\n\nAgainst: Players who voted \"Against\" or abstained discard all of their action cards. The player who cast the most votes \"Against\" must give 1 promissory note to the other player with the most cultural planets."},{"n":"Covert Legislation","t":"Directive","e":null,"x":"When this agenda is revealed, the speaker draws the next card in the agenda deck but does not reveal it to the other players. If it is Emergency Session, it is revealed and the speaker draws the next card instead.\n\nThe speaker reads the eligible outcomes aloud (for, against, elect player, etc.); the other players vote for these outcomes as if they were outcomes of this agenda, without knowing their effects."},{"n":"Discretionary Spending","t":"Directive","e":null,"x":"For: All players gain trade goods equal to the number of planets they control. The player who cast the most votes \"For\" replenishes their commodities.  In voting order, each player may spend any number of trade goods as follows, with the given costs (they cannot choose the same system or planet more than once): use the PRODUCTION ability of their units in any system (Cost); research up to 2 technologies (4 each); place 1 structure on a planet they control (3); draw 1 action card (1); explore a planet they control or a frontier token in a system that contains their ships (1).\n\nAgainst: All players except the player who cast the most votes \"Against\" lose half of their trade goods (rounded up)."},{"n":"Economic Equality","t":"Law","e":null,"x":"For: Each player returns all their trade goods to the supply. All players have a commodity value of 3.  The player that cast the most votes \"For\" replenishes their commodities.\n\nAgainst: The player who cast the most votes \"Against\" gains a number of trade goods equal to their current number of trade goods. For every 3 trade goods they gain this way, all other players lose 1 trade good, if able."},{"n":"Emergency Session","t":"Resolution","e":null,"x":"When this card is revealed, place it in the common play area and reveal another card from the agenda deck. This card is not an agenda, and players do not vote on this card.\n\nAfter all other agendas are resolved during the agenda phase, the speaker reveals and the players vote on 1 additional agenda. Then discard this card."},{"n":"Enforced Travel Ban","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 3 of their control tokens on this card. Alpha and beta wormholes have no effect during movement. A player whose control token is on this card may discard 1 control token at any time to allow the current active player to ignore the effects of this law for the duration of their turn.\n\nAgainst: Players who voted \"Against\" gain 1 trade good for each wormhole in systems that contain 1 or more of their units. Players that gained trade goods also gain 1 commodity for each of their neighbors."},{"n":"Executive Sanctions","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 1 of their control tokens on this card. A player whose control token is on this card can have a maximum of 5 action cards in their hand. All other players can have a maximum of 3 action cards in their hand.\n\nAgainst: The player who cast the most votes \"Against\" draws 5 action cards."},{"n":"Fleet Regulations","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 1 of their control tokens on this card. A player whose control token is on this card can have a maximum of 5 of their command tokens in their fleet pool. All other players can have a maximum of 4 of their command tokens in their fleet pool.\n\nAgainst: The player who cast the most votes \"Against\" places 2 command tokens from their reinforcements in their fleet pool."},{"n":"Galactic Crisis Pact","t":"Directive","e":"Strategy Card","x":"Elect strategy card.\n\nEach player may resolve the secondary ability of the elected strategy card without spending a command token; command tokens placed by the ability are placed from a player's reinforcements, instead.  \n\nThe player who cast the most votes for the elected strategy card may choose to spend a token from their strategy pool in order to resolve the primary ability, instead."},{"n":"Homeland Defense Act","t":"Law","e":null,"x":"For: When placing 1 or more PDS on a planet, players may place an additional PDS on that planet.  The player who cast the most votes \"For\" may place a PDS on a planet they control.\n\nAgainst: Each player destroys 1 of their PDS units.  Each player who voted \"Against\" or abstained must give 1 promissory note from their hand to a player who voted \"For,\" if able."},{"n":"Hyperlane Development Program","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" may research 1 [propulsion symbol] technology. Non-anomaly systems that contain no planets do not cost movement for ships to move through. Players may allow other players' ships to move through their ships in those systems. \n\nAgainst: Exhaust the Trade strategy card. All players return 3 trade goods to the supply, or all of their trade goods if they have less than 3. The player who cast the most votes \"Against\" may place 1 cruiser or destroyer from their reinforcements in each system that contains their ships and no planets or anomalies."},{"n":"Imperial Arbiter","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card and gives each other player who voted for them 1 promissory note from their hand (in order of most votes to least), if able.\n\nAt the end of the strategy phase, the owner of this card may spend 1 command token from their strategy pool and up to 8 influence to swap 1 of their strategy cards with a strategy card that has an initiative value equal to or less than the influence spent."},{"n":"Incentive Program","t":"Directive","e":null,"x":"For: Draw and reveal 1 stage I public objective from the deck and place it near the public objectives. The player who cast the most votes \"For\" may immediately score that objective, if they meet the requirements, or draw 2 action cards if they do not.\n\nAgainst: Draw and reveal 1 stage II public objective from the deck and place it near the public objectives. The player who cast the most votes \"Against\" may immediately score that objective, if they meet the requirements, or draw 3 action cards if they do not."},{"n":"Ixthian Artifact","t":"Directive","e":null,"x":"For: The speaker rolls 1 die. If the result is 7-10, each player may research 2 technologies. If the result is 1-6, destroy all units in Mecatol Rex's system, and each player with units in systems adjacent to Mecatol Rex's system destroys 3 of their own units in each of those systems.\n\nAgainst: Attach this card to the Mecatol Rex planet card.  The player who controls Mecatol Rex gains 1 victory point, and loses 1 victory point if they lose control of Mecatol Rex."},{"n":"Judicial Abolishment","t":"Law","e":null,"x":"For: At the start of the Agenda Phase, the speaker may spend 6 influence to discard any 1 law in play.\n\nAgainst:  Reveal cards from the bottom of the agenda deck until a law is revealed. Put that law into play.  The player that cast the most votes \"Against\" is considered to have cast the most votes for that law and chooses what outcome is elected, if applicable."},{"n":"Minister of Antiquities","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Imperial strategy card without spending a command token.\n\nWhenever the owner of this card may score a public objective, they may choose to draw a relic instead."},{"n":"Minister of Commerce","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card.  The owner of this card may resolve the secondary ability of the Trade strategy card without spending a command token.\n\nWhenever the owner of this card replenishes their commodities, they gain 1 trade good per player that is their neighbor."},{"n":"Minister of Exploration","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card gains 1 additional command token when resolving the secondary ability of the Leadership strategy card.\n\nAfter performing a tactical action, the owner of this card may explore 1 frontier token or 1 planet that contains their units in the active system."},{"n":"Minister of Industry","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Construction strategy card without spending or placing a command token.\n\nThe owner of this card increases the PRODUCTION value of their space docks by 4."},{"n":"Minister of Peace","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Diplomacy strategy card without spending a command token.\n\nAfter a player activates a system that contains 1 or more of another player's units, the owner of this card may spend 1 command token from their strategy pool and give the active player 1 promissory note from their hand to immediately end that player's turn."},{"n":"Minister of Policy","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may use the secondary ability of the Politics strategy card without spending a command token.\n\nDuring the draw action cards step of the status phase, instead of players drawing randomly, the owner of this card looks at a number of action cards from the top of the deck equal to the number of players plus 1, adds 2 to their hand, then gives one to each other player. Players that are able to draw more than 1 action card may then draw additional cards, as normal."},{"n":"Minister of Sciences","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Technology strategy card without spending a command token.\n\nThe owner of this card does not need to spend resources to research technology as part of the Technology strategy card."},{"n":"Minister of War","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Warfare strategy card without spending a command token.  The owner of this card may use the following component action:\n\nACTION: Exhaust this card and spend 1 command token from your strategy pool to remove 1 of your command tokens from the game board."},{"n":"Miscount Disclosed","t":"Directive","e":"Law","x":"When this agenda is revealed, if there are no laws in play, discard this card and reveal another agenda from the top of the deck.\n\nElect law.\n\nVote on the elected law as if it had just been revealed from the top of the deck. The player who cast the most votes for the elected law casts 1 additional vote per player when voting on the elected law."},{"n":"Mutiny","t":"Directive","e":null,"x":"For: Exhaust the Politics strategy card. The player who cast the most votes \"For\" takes the speaker token. All players who voted \"For\" gain 1 victory point. If all players voted \"For,\" the speaker gains 1 additional victory point.\n\nAgainst: Each player who voted \"For\" loses 1 victory point and must give the speaker 1 promissory note from their hand. If all players voted \"Against\" or abstained, the speaker and the other player who cast the most votes \"Against\" gain 1 victory point."},{"n":"New Constitution","t":"Directive","e":null,"x":"For: Discard all laws in play, if any.  The player who cast the most votes \"For\" takes the speaker token, then reveals cards from the bottom of the agenda deck until a law is revealed. Players vote on that law as if it had just been revealed from the top of the deck. Shuffle the other revealed agendas back into the agenda deck.\n\nAgainst: Each player who voted \"Against\" or abstained must give a player who voted \"For\" 1 promissory note from their hand, if able."},{"n":"Nexus Sovereignty","t":"Law","e":null,"x":"For: Alpha and beta wormholes in the wormhole nexus have no effect on movement. The player who controls Mallice may spend 1 influence at any time to allow the current active player to ignore the effects of this law for the duration of their turn.\n\nAgainst: Place a gamma wormhole token in the Mecatol Rex system.  The player who cast the most votes “Against” destroys 1 of their non-fighter ships in each system in and adjacent to the wormhole nexus."},{"n":"Pax Magnifica, Bellum Gloriosum","t":"Law","e":null,"x":"For: Exhaust the Warfare strategy card. The player who cast the most votes \"For\" adds 2 command tokens from their reinforcements to their strategy pool. Players reveal all Ceasefire promissory notes in their hand, then in voting order, give each Ceasefire matching their color to another player. Players cannot receive Ceasefire promissory notes matching their color as part of transactions.\n\nAgainst: Exhaust the Diplomacy strategy card. The player who cast the most votes \"Against\" adds 2 command tokens from their reinforcements to their fleet pool. Players may use the PRODUCTION ability of any number of their units.  After resolving this outcome, skip to the Ready Planets step of the agenda phase."},{"n":"Political Censure","t":"Law","e":"Player","x":"Elect Player.\n\nThe elected player gains this card and 1 victory point.  If they are speaker, the other player who cast the most votes for them takes the speaker token.\n\nThe owner of this card cannot play action cards and cannot take or receive the speaker token. If the elected player loses this card, they lose 1 victory point."},{"n":"Preservation of Historical Sites","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" gains 2 trade goods for each legendary planet or planet with attachments that they control. Players must spend 1 influence to explore industrial planets and 2 influence to explore cultural planets.\n\nAgainst: The player who cast the most votes \"Against\" may immediately explore each planet they control in 1 system."},{"n":"Prophecy of Ixth","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may ignore the prerequisites on fighter unit upgrade technologies and applies +1 to the results of their fighter's combat rolls.  Hits produced by their fighters must be applied to non-fighter ships, if able.  When the owner of this card uses PRODUCTION, they return this card to the common play area unless they produce 2 or more fighters.  If this card is in the common play area, a player may take it if they produce 4 or more fighters when using PRODUCTION."},{"n":"Public Execution","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player exhausts all of their planets, then reveals the action cards in their hand.  The other players that voted for the elected player (in order of most to least votes) may each take 1 action card from that player’s hand, then the rest are discarded.  If the elected player has the speaker token, they give it to the other player who cast the most votes for them."},{"n":"Publicize Weapon Schematics","t":"Law","e":"Owned Unit Upgrade","x":"When this agenda is revealed, if there are no eligible technologies in play, discard this card and reveal another agenda from the top of the deck.\n\nElect owned unit upgrade technology.\n\nEach player may ignore the prerequisites on unit upgrade technologies that match the unit type of the elected technology. That unit type loses the SUSTAIN DAMAGE ability if it has it. The player who cast the most votes for the elected technology may immediately gain a unit upgrade technology for that unit type."},{"n":"Rearmament Agreement","t":"Directive","e":null,"x":"For: Each player places 1 mech from their reinforcements on a planet they control in their home system.  The player who cast the most votes \"For\" places an additional mech from their reinforcements on any planet they control and adds 1 command token from their reinforcements to their fleet pool.\n\nAgainst: Each player replaces each of their mechs with an infantry from their reinforcements.  The player who cast the most votes \"Against\" places 1 command token from their reinforcements in their strategy pool for every 2 planets they control that do not contain ground forces."},{"n":"Regulated Conscription","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" gains 1 trade good for every industrial planet they control. When a player produces units, they produce only 1 fighter or infantry for their cost, instead of 2.\n\nAgainst:  The player who cast the most votes \"Against\" must give 1 promissory note to the other player with the most Industrial planets.  At the start of the strategy phase, players who voted \"Against\" or abstained must exhaust all of their industrial planets."},{"n":"Representative Government","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" takes the speaker token. When casting votes, players cast votes equal to the number of planets exhausted, instead of the planets' combined influence value.  A player that exhausts Mecatol Rex casts 1 additional vote. Players cannot cast additional votes from other sources.\n\nAgainst: At the start of the next strategy phase, each player who voted \"Against\" or abstained exhausts all of their cultural planets and cannot choose the Politics strategy card unless it is the only unchosen strategy card."},{"n":"Research Grant Reallocation","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player researches any 1 non-faction technology.  The other player who cast the most votes for the elected player may spend 2 trade goods per prerequisite on that technology to gain that technology."},{"n":"Search Warrant","t":"Law","e":"Player","x":"Elect player.\n\nThe non-elected player who cast the most votes for the elected player places 1 of their control tokens on this card. The elected player gains this card and draws 2 secret objectives.\n\nThe owner of this card plays with their secret objectives revealed.  When the owner of this card would discard a secret objective, a player whose control token is on this card may take that secret objective instead."},{"n":"Seed of an Empire","t":"Directive","e":null,"x":"For: The player with the most victory points (speaker breaks ties) gains the speaker token and 1 victory point, then gives 1 promissory note to each other player who voted \"For\" (in order of most to least votes), if able.\n\nAgainst: The player with the least victory points (speaker breaks ties) gains 1 victory point, draws 3 action cards, and adds 1 command token from their reinforcements to each of their tactics, fleet, and strategy pools."},{"n":"Shared Research","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" may explore any frontier tokens in anomalies that contain their ships. During tactical actions, the active player may decide that any anomaly that does not contain a frontier token does not affect movement. \n\nAgainst: The player who cast the most votes \"For\" takes 1 command token from the reinforcements of each player who voted \"Against\" or abstained and places them in any number of anomaly systems."},{"n":"Swords to Plowshares","t":"Directive","e":null,"x":"For: Each player removes half of their infantry on each planet they control, rounding down. Each player gains trade goods equal to the number of their infantry removed. The player who cast the most votes \"For\" may explore each planet from which their infantry were removed.\n\nAgainst: The player who cast the most votes \"Against\" places 1 infantry from their reinforcements on each planet they control."},{"n":"Term Limits","t":"Law","e":null,"x":"For: The speaker places 1 of their control tokens on this card. When a player takes or receives the speaker token, they place 1 of their control tokens on this card. A player whose control token is on this card cannot take or receive the speaker token. If a control token from each player is on this card, remove them.\n\nAgainst: The player who cast the most votes \"Against\" draws 2 action cards. Exhaust the Politics strategy card. Players who voted \"Against\" or abstained must give 1 promissory note from their hand to a player who voted \"For,\" if able."},{"n":"Unconventional Measures","t":"Directive","e":null,"x":"For: Each player who voted \"For\" draws 2 action cards. Each player who voted \"Against\" gains 1 command token.\n\nAgainst: Each player who voted \"Against\" or abstained discards their action cards. The player who cast the most votes \"For\" chooses 1 strategy card to become exhausted."},{"n":"Wormhole Reconstruction","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" places 1 control token on this card.  Players may treat alpha wormholes as beta wormholes during movement, and vice versa. A player whose control token is on this card gains 1 commodity each time another player's ships move through an alpha or beta wormhole.\n\nAgainst: The player who cast the most votes \"For\" takes 1 command token from the reinforcements of each player who voted \"Against\" or abstained and places them into any number of systems that contain alpha or beta wormholes."},{"n":"Wormhole Research","t":"Directive","e":null,"x":"For: Players with ships in systems that contain 1 or more wormholes may research 1 technology with no more than 1 prerequisite per type of wormhole in those systems. The player who cast the most votes \"For\" may gain any 1 non-faction technology researched this way.\n\nAgainst: In systems that contain their ships and wormholes, each player who voted \"For\" destroys 1 non-fighter ship for each alpha or beta wormhole. Each player who voted \"Against\" or abstained removes 1 command token from their command sheet and returns it to their reinforcements."}];

function elimDo(){const e=ELM.e;if(e==null||!elOk()||e<0||e>=S.f.length)return;
 pushUndo();
 const n=S.f.length,name=F[S.f[e]][0],short=F[S.f[e]][1],rm=j=>elRm(j,e);
 /* players who lose a Support for the Throne that the eliminated player gave them */
 const lost={};S.mp.forEach(m=>{if(m.r===SFT&&m.from===e&&m.p!==e)lost[m.p]=(lost[m.p]||0)+m.pts});
 /* speaker: passes to the player on the speaker's left (= next seat) */
 if(S.sp!==undefined&&S.sp!==''&&S.sp!==null){const k=+S.sp;S.sp=String(k===e?(e<n-1?e:0):rm(k))}
 /* Mageon Implants pointer */
 const mgp=S.mg&&S.mg.p!=null?S.mg.p:null;
 /* manual VP (secret objectives, Support for the Throne, riders...): theirs vanish, notes they gave vanish */
 S.mp=S.mp.filter(m=>m.p!==e&&!(m.r===SFT&&m.from===e));S.mp.forEach(m=>{m.p=rm(m.p);if(m.from!=null)m.from=rm(m.from)});
 /* public objectives */
 S.obj.forEach(o=>{o.s=o.s.filter(j=>j!==e).map(rm)});
 /* Styx / Shard / Custodians / Ixthian holders (-1 = Custodians token taken by an eliminated player) */

 /* agenda cards (laws) they own are discarded */
 S.laws=(S.laws||[]).filter(l=>l.own!==e);S.laws.forEach(l=>{if(l.own>e)l.own--});
 /* per-player arrays */
 [S.f,S.pc,S.pa,S.xa,S.tech,S.sc].forEach(a=>{if(Array.isArray(a)&&a.length>e)a.splice(e,1)});
 if(Array.isArray(S.v)&&S.v.length>e)S.v.splice(e,1);
 /* history / VP chart */
 (S.hist||[]).forEach(h=>{if(Array.isArray(h.tot)&&h.tot.length>e)h.tot.splice(e,1)});
 S.hist=(S.hist||[]).filter(h=>h.p!==e);S.hist.forEach(h=>{if(h.p!=null&&h.p>e)h.p--});
 S.hide=(S.hide||[]).filter(j=>j!==e).map(rm);

 /* draft / strategy order */

 if(S.mg){const y=mgYssIdx(),N=S.f.length;if(y<0||mgp==null)S.mg=null;else{let p=mgp===e?e%N:rm(mgp),t=0;while(p===y&&t++<N)p=(p+1)%N;S.mg.p=p}}

 /* VP track: record the consequences */
 Object.keys(lost).forEach(j=>{if(lost[j])snap(rm(+j),-lost[j],SFT+' returned – '+short+' eliminated')});
 snap(null,0,'Eliminated: '+name);
 /* close everything that still shows the old player list */
 hideOv();miClose();mgClose();rndClose();qdClose();elimClose();closeRes();const ov=$('ov');if(ov)ov.style.display='none';
 ELM.e=null;ELM.step='pick';
 if(S.view==='agenda'&&S.step===4&&S.ag&&mode(S.ag)!=='res'&&$('vb')){
  /* keep the agenda timer running: only rebuild the voting panel */
  S.v=S.f.map(()=>({votes:0,c:null,riders:[]}));S.rs=null;chrome();updDots();rv();updateRiderInfo();renderFV()}
 else go();
 if(S.view==='action'&&S.sT&&S.sT.open)openStrat();
 toastMsg(short+' eliminated – game continues with '+S.f.length+' players','#ff7b6b')}
