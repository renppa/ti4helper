.fl.on{opacity:1;transform:none}
.fl.on::before{animation:flwave 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.45s)}
@keyframes flwave{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg) scale(1.02)}}
.fphint{text-align:center;font-size:.78rem;opacity:.6;margin-top:.7rem}
@media (max-width:600px){.fl{margin:0 -.25rem}.fprow{height:clamp(4.6rem,24vw,6rem)}}
@media (prefers-reduced-motion:reduce){.fl,.fl::before,.fpcount b{transition:none!important;animation:none!important}}
.sbr em.nup,.sbr em.ndn{display:inline-block}
.sbr em.nup{animation:vpnup .75s cubic-bezier(.2,1.5,.4,1) var(--ad,0s) both}
.sbr em.ndn{animation:vpndn .5s ease-out var(--ad,0s) both}
@keyframes vpnup{0%{opacity:0;transform:translateY(70%) scale(.5);color:var(--gold)}50%{opacity:1;transform:translateY(-6%) scale(1.5);color:var(--gold);text-shadow:0 0 1.2rem var(--gold)}100%{transform:none}}
@keyframes vpndn{0%{opacity:0;transform:translateY(-60%) scale(.8)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sbr em.nup,.sbr em.ndn{animation:none}}
.scl .scx{text-decoration:line-through;text-decoration-thickness:.12rem;opacity:.55}
.sbn .scl b.pass{color:#ff4040;font-weight:800;letter-spacing:.05em;font-size:.72rem!important;margin-left:.2rem;display:inline}
.vav{font-size:.8rem;opacity:.85;margin:.2rem 0 .4rem}.vav b{color:var(--gold)}
.vbk{font-size:.8rem;margin:.3rem 0}.vbk .pibx{color:#ffd84a}.vbk .arbx{color:#ffb86b}.vbk .vwarn{color:#ff7b7b;margin-top:.2rem}
.pib{display:flex;flex-direction:column;align-items:center;width:100%;margin:.3rem 0;padding:.35rem .6rem;border-radius:.8rem;border:.12rem solid #ffd84a;background:transparent;color:#ffd84a;font:inherit;font-weight:700;cursor:pointer}

<script>
let D=[{"n":"Affirmation of Divine Right","t":"Law","e":null,"x":"For: Mecatol Rex is a legendary planet. At the end of each strategy phase, each other player must give the player who controls Mecatol Rex 1 promissory note from their hand, if able.\n\nAgainst: Exhaust the Imperial strategy card. Place this card with the current laws and place the custodians token on it. The player who had the custodians token loses 1 victory point. While this law is in play with the custodians token on it, players cannot gain victory points from the Imperial strategy card for controlling Mecatol Rex. If this law is discarded, the player who controls Mecatol Rex gains the custodians token and 1 victory point."},{"n":"Anti-Intellectual Revolution","t":"Law","e":null,"x":"For: Each player who voted \"For\" or abstained returns 1 technology they own with the most prerequisites to their technology decks. Double the prerequisites on all technologies.\n\nAgainst: Exhaust the Technology strategy card. Any player who voted \"Against\" or abstained destroys a number of their units on the game board with a combined cost of at least 6 resources."},{"n":"Archived Secret","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player draws 2 secret objectives, then gives 1 promissory note from their hand to the other player who cast the most votes for them."},{"n":"Armed Forces Standardization","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player places command tokens from their reinforcements until they have 3 tokens in their tactic pool, 3 tokens in their fleet pool, and 2 tokens in their strategy pool. They return any excess tokens to their reinforcements, then the other player who cast the most votes for the elected player gives them 1 promissory note from their hand."},{"n":"Arms Reduction","t":"Directive","e":null,"x":"For: Each player destroys all of their dreadnoughts and half of their cruisers (rounding up). Players gain 2 trade goods for each dreadnought and 1 trade good for each cruiser destroyed this way. The player who cast the most votes \"For\" adds 1 command token from their reinforcements to their strategy pool.\n\nAgainst: The player who cast the most votes \"Against\" may research 1 unit upgrade technology, then place 1 dreadnought or 2 cruisers in a system that contains only their units."},{"n":"Articles of War","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 3 of their control tokens on this card. All mechs lose their printed abilities except for SUSTAIN DAMAGE. When any player activates a system, a player whose control token is on this card may discard 1 control token to ignore the effects of this law during that tactical action.\n\nAgainst: Players who voted \"For\" or abstained replace each of their mechs on the game board with an infantry from their reinforcements. The player who cast the most votes \"Against\" may place any number of mechs in their reinforcements on any planet or planets they control."},{"n":"Checks and Balances","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" places 1 of their control tokens on this card. When a player chooses a strategy card during the strategy phase, they give that strategy card to another player who does not have 1 (or a player who does not have 2, in a 3- or 4-player game), if able. If a player whose control token is on this card does not currently have a strategy card, they may discard that token to keep a chosen strategy card instead.\n\nAgainst: Remove all control tokens from public objectives and shuffle all scored secret objectives back into the deck.  Players do not gain or lose victory points as a result of this."},{"n":"Clandestine Operations","t":"Directive","e":null,"x":"For: The player who cast the most votes \"For\" gains 2 command tokens and takes the speaker token. Then, each player removes 1 command token from the command sheet of the player to their left and returns it to that player's reinforcements.\n\nAgainst: Each player removes 1 command token from their fleet pool.  Exhaust the Politics strategy card."},{"n":"Classified Document Leak","t":"Law","e":"Scored Secret Objective","x":"Elect scored secret objective.\n\nThe elected secret objective becomes a public objective. The player who cast the most votes for that objective may immediately score it, if they meet the requirements, or draw 2 action cards if they do not."},{"n":"Colonial Redistribution","t":"Directive","e":"Non-home, non-Rex planet","x":"Elect non-home planet other than Mecatol Rex.\n\nRemove each unit on the elected planet. The player who controls that planet places the removed units on 1 or more planets they control in their home system, if able, then chooses 1 other player with the fewest victory points; that player places 3 infantry from their reinforcements on the elected planet."},{"n":"Committee Formation","t":"Law","e":"Player","x":"Elect Player.\n\nThe elected player gains this card and gives each other player who voted for them 1 promissory note from their hand (in order of most votes to least), if able.\n\nBefore players vote on an agenda that requires a player to be elected, the owner of this card may discard this card to choose the player to be elected. Players do not vote on that agenda. The owner of this card is considered to have cast the most votes for the resolved outcome."},{"n":"Compensated Disarmament","t":"Directive","e":"Planet","x":"Elect planet.\n\nRemove each ground force on the elected planet; the player who controls that planet gains 1 trade good for each infantry removed and 2 trade goods for each mech removed.\n\nThe other player who cast the most votes for the elected planet gives the owner of the elected planet 1 promissory note from their hand."},{"n":"Conventions of War","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" gains 1 trade good for each of their cultural planets. Players cannot use BOMBARDMENT against cultural planets.\n\nAgainst: Players who voted \"Against\" or abstained discard all of their action cards. The player who cast the most votes \"Against\" must give 1 promissory note to the other player with the most cultural planets."},{"n":"Covert Legislation","t":"Directive","e":null,"x":"When this agenda is revealed, the speaker draws the next card in the agenda deck but does not reveal it to the other players. If it is Emergency Session, it is revealed and the speaker draws the next card instead.\n\nThe speaker reads the eligible outcomes aloud (for, against, elect player, etc.); the other players vote for these outcomes as if they were outcomes of this agenda, without knowing their effects."},{"n":"Discretionary Spending","t":"Directive","e":null,"x":"For: All players gain trade goods equal to the number of planets they control. The player who cast the most votes \"For\" replenishes their commodities.  In voting order, each player may spend any number of trade goods as follows, with the given costs (they cannot choose the same system or planet more than once): use the PRODUCTION ability of their units in any system (Cost); research up to 2 technologies (4 each); place 1 structure on a planet they control (3); draw 1 action card (1); explore a planet they control or a frontier token in a system that contains their ships (1).\n\nAgainst: All players except the player who cast the most votes \"Against\" lose half of their trade goods (rounded up)."},{"n":"Economic Equality","t":"Law","e":null,"x":"For: Each player returns all their trade goods to the supply. All players have a commodity value of 3.  The player that cast the most votes \"For\" replenishes their commodities.\n\nAgainst: The player who cast the most votes \"Against\" gains a number of trade goods equal to their current number of trade goods. For every 3 trade goods they gain this way, all other players lose 1 trade good, if able."},{"n":"Emergency Session","t":"Resolution","e":null,"x":"When this card is revealed, place it in the common play area and reveal another card from the agenda deck. This card is not an agenda, and players do not vote on this card.\n\nAfter all other agendas are resolved during the agenda phase, the speaker reveals and the players vote on 1 additional agenda. Then discard this card."},{"n":"Enforced Travel Ban","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 3 of their control tokens on this card. Alpha and beta wormholes have no effect during movement. A player whose control token is on this card may discard 1 control token at any time to allow the current active player to ignore the effects of this law for the duration of their turn.\n\nAgainst: Players who voted \"Against\" gain 1 trade good for each wormhole in systems that contain 1 or more of their units. Players that gained trade goods also gain 1 commodity for each of their neighbors."},{"n":"Executive Sanctions","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 1 of their control tokens on this card. A player whose control token is on this card can have a maximum of 5 action cards in their hand. All other players can have a maximum of 3 action cards in their hand.\n\nAgainst: The player who cast the most votes \"Against\" draws 5 action cards."},{"n":"Fleet Regulations","t":"Law","e":null,"x":"For: The player who cast the most votes “For” places 1 of their control tokens on this card. A player whose control token is on this card can have a maximum of 5 of their command tokens in their fleet pool. All other players can have a maximum of 4 of their command tokens in their fleet pool.\n\nAgainst: The player who cast the most votes \"Against\" places 2 command tokens from their reinforcements in their fleet pool."},{"n":"Galactic Crisis Pact","t":"Directive","e":"Strategy Card","x":"Elect strategy card.\n\nEach player may resolve the secondary ability of the elected strategy card without spending a command token; command tokens placed by the ability are placed from a player's reinforcements, instead.  \n\nThe player who cast the most votes for the elected strategy card may choose to spend a token from their strategy pool in order to resolve the primary ability, instead."},{"n":"Homeland Defense Act","t":"Law","e":null,"x":"For: When placing 1 or more PDS on a planet, players may place an additional PDS on that planet.  The player who cast the most votes \"For\" may place a PDS on a planet they control.\n\nAgainst: Each player destroys 1 of their PDS units.  Each player who voted \"Against\" or abstained must give 1 promissory note from their hand to a player who voted \"For,\" if able."},{"n":"Hyperlane Development Program","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" may research 1 [propulsion symbol] technology. Non-anomaly systems that contain no planets do not cost movement for ships to move through. Players may allow other players' ships to move through their ships in those systems. \n\nAgainst: Exhaust the Trade strategy card. All players return 3 trade goods to the supply, or all of their trade goods if they have less than 3. The player who cast the most votes \"Against\" may place 1 cruiser or destroyer from their reinforcements in each system that contains their ships and no planets or anomalies."},{"n":"Imperial Arbiter","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card and gives each other player who voted for them 1 promissory note from their hand (in order of most votes to least), if able.\n\nAt the end of the strategy phase, the owner of this card may spend 1 command token from their strategy pool and up to 8 influence to swap 1 of their strategy cards with a strategy card that has an initiative value equal to or less than the influence spent."},{"n":"Incentive Program","t":"Directive","e":null,"x":"For: Draw and reveal 1 stage I public objective from the deck and place it near the public objectives. The player who cast the most votes \"For\" may immediately score that objective, if they meet the requirements, or draw 2 action cards if they do not.\n\nAgainst: Draw and reveal 1 stage II public objective from the deck and place it near the public objectives. The player who cast the most votes \"Against\" may immediately score that objective, if they meet the requirements, or draw 3 action cards if they do not."},{"n":"Ixthian Artifact","t":"Directive","e":null,"x":"For: The speaker rolls 1 die. If the result is 7-10, each player may research 2 technologies. If the result is 1-6, destroy all units in Mecatol Rex's system, and each player with units in systems adjacent to Mecatol Rex's system destroys 3 of their own units in each of those systems.\n\nAgainst: Attach this card to the Mecatol Rex planet card.  The player who controls Mecatol Rex gains 1 victory point, and loses 1 victory point if they lose control of Mecatol Rex."},{"n":"Judicial Abolishment","t":"Law","e":null,"x":"For: At the start of the Agenda Phase, the speaker may spend 6 influence to discard any 1 law in play.\n\nAgainst:  Reveal cards from the bottom of the agenda deck until a law is revealed. Put that law into play.  The player that cast the most votes \"Against\" is considered to have cast the most votes for that law and chooses what outcome is elected, if applicable."},{"n":"Minister of Antiquities","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Imperial strategy card without spending a command token.\n\nWhenever the owner of this card may score a public objective, they may choose to draw a relic instead."},{"n":"Minister of Commerce","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card.  The owner of this card may resolve the secondary ability of the Trade strategy card without spending a command token.\n\nWhenever the owner of this card replenishes their commodities, they gain 1 trade good per player that is their neighbor."},{"n":"Minister of Exploration","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card gains 1 additional command token when resolving the secondary ability of the Leadership strategy card.\n\nAfter performing a tactical action, the owner of this card may explore 1 frontier token or 1 planet that contains their units in the active system."},{"n":"Minister of Industry","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Construction strategy card without spending or placing a command token.\n\nThe owner of this card increases the PRODUCTION value of their space docks by 4."},{"n":"Minister of Peace","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Diplomacy strategy card without spending a command token.\n\nAfter a player activates a system that contains 1 or more of another player's units, the owner of this card may spend 1 command token from their strategy pool and give the active player 1 promissory note from their hand to immediately end that player's turn."},{"n":"Minister of Policy","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may use the secondary ability of the Politics strategy card without spending a command token.\n\nDuring the draw action cards step of the status phase, instead of players drawing randomly, the owner of this card looks at a number of action cards from the top of the deck equal to the number of players plus 1, adds 2 to their hand, then gives one to each other player. Players that are able to draw more than 1 action card may then draw additional cards, as normal."},{"n":"Minister of Sciences","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Technology strategy card without spending a command token.\n\nThe owner of this card does not need to spend resources to research technology as part of the Technology strategy card."},{"n":"Minister of War","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may resolve the secondary ability of the Warfare strategy card without spending a command token.  The owner of this card may use the following component action:\n\nACTION: Exhaust this card and spend 1 command token from your strategy pool to remove 1 of your command tokens from the game board."},{"n":"Miscount Disclosed","t":"Directive","e":"Law","x":"When this agenda is revealed, if there are no laws in play, discard this card and reveal another agenda from the top of the deck.\n\nElect law.\n\nVote on the elected law as if it had just been revealed from the top of the deck. The player who cast the most votes for the elected law casts 1 additional vote per player when voting on the elected law."},{"n":"Mutiny","t":"Directive","e":null,"x":"For: Exhaust the Politics strategy card. The player who cast the most votes \"For\" takes the speaker token. All players who voted \"For\" gain 1 victory point. If all players voted \"For,\" the speaker gains 1 additional victory point.\n\nAgainst: Each player who voted \"For\" loses 1 victory point and must give the speaker 1 promissory note from their hand. If all players voted \"Against\" or abstained, the speaker and the other player who cast the most votes \"Against\" gain 1 victory point."},{"n":"New Constitution","t":"Directive","e":null,"x":"For: Discard all laws in play, if any.  The player who cast the most votes \"For\" takes the speaker token, then reveals cards from the bottom of the agenda deck until a law is revealed. Players vote on that law as if it had just been revealed from the top of the deck. Shuffle the other revealed agendas back into the agenda deck.\n\nAgainst: Each player who voted \"Against\" or abstained must give a player who voted \"For\" 1 promissory note from their hand, if able."},{"n":"Nexus Sovereignty","t":"Law","e":null,"x":"For: Alpha and beta wormholes in the wormhole nexus have no effect on movement. The player who controls Mallice may spend 1 influence at any time to allow the current active player to ignore the effects of this law for the duration of their turn.\n\nAgainst: Place a gamma wormhole token in the Mecatol Rex system.  The player who cast the most votes “Against” destroys 1 of their non-fighter ships in each system in and adjacent to the wormhole nexus."},{"n":"Pax Magnifica, Bellum Gloriosum","t":"Law","e":null,"x":"For: Exhaust the Warfare strategy card. The player who cast the most votes \"For\" adds 2 command tokens from their reinforcements to their strategy pool. Players reveal all Ceasefire promissory notes in their hand, then in voting order, give each Ceasefire matching their color to another player. Players cannot receive Ceasefire promissory notes matching their color as part of transactions.\n\nAgainst: Exhaust the Diplomacy strategy card. The player who cast the most votes \"Against\" adds 2 command tokens from their reinforcements to their fleet pool. Players may use the PRODUCTION ability of any number of their units.  After resolving this outcome, skip to the Ready Planets step of the agenda phase."},{"n":"Political Censure","t":"Law","e":"Player","x":"Elect Player.\n\nThe elected player gains this card and 1 victory point.  If they are speaker, the other player who cast the most votes for them takes the speaker token.\n\nThe owner of this card cannot play action cards and cannot take or receive the speaker token. If the elected player loses this card, they lose 1 victory point."},{"n":"Preservation of Historical Sites","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" gains 2 trade goods for each legendary planet or planet with attachments that they control. Players must spend 1 influence to explore industrial planets and 2 influence to explore cultural planets.\n\nAgainst: The player who cast the most votes \"Against\" may immediately explore each planet they control in 1 system."},{"n":"Prophecy of Ixth","t":"Law","e":"Player","x":"Elect player.\n\nThe elected player gains this card. The owner of this card may ignore the prerequisites on fighter unit upgrade technologies and applies +1 to the results of their fighter's combat rolls.  Hits produced by their fighters must be applied to non-fighter ships, if able.  When the owner of this card uses PRODUCTION, they return this card to the common play area unless they produce 2 or more fighters.  If this card is in the common play area, a player may take it if they produce 4 or more fighters when using PRODUCTION."},{"n":"Public Execution","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player exhausts all of their planets, then reveals the action cards in their hand.  The other players that voted for the elected player (in order of most to least votes) may each take 1 action card from that player’s hand, then the rest are discarded.  If the elected player has the speaker token, they give it to the other player who cast the most votes for them."},{"n":"Publicize Weapon Schematics","t":"Law","e":"Owned Unit Upgrade","x":"When this agenda is revealed, if there are no eligible technologies in play, discard this card and reveal another agenda from the top of the deck.\n\nElect owned unit upgrade technology.\n\nEach player may ignore the prerequisites on unit upgrade technologies that match the unit type of the elected technology. That unit type loses the SUSTAIN DAMAGE ability if it has it. The player who cast the most votes for the elected technology may immediately gain a unit upgrade technology for that unit type."},{"n":"Rearmament Agreement","t":"Directive","e":null,"x":"For: Each player places 1 mech from their reinforcements on a planet they control in their home system.  The player who cast the most votes \"For\" places an additional mech from their reinforcements on any planet they control and adds 1 command token from their reinforcements to their fleet pool.\n\nAgainst: Each player replaces each of their mechs with an infantry from their reinforcements.  The player who cast the most votes \"Against\" places 1 command token from their reinforcements in their strategy pool for every 2 planets they control that do not contain ground forces."},{"n":"Regulated Conscription","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" gains 1 trade good for every industrial planet they control. When a player produces units, they produce only 1 fighter or infantry for their cost, instead of 2.\n\nAgainst:  The player who cast the most votes \"Against\" must give 1 promissory note to the other player with the most Industrial planets.  At the start of the strategy phase, players who voted \"Against\" or abstained must exhaust all of their industrial planets."},{"n":"Representative Government","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" takes the speaker token. When casting votes, players cast votes equal to the number of planets exhausted, instead of the planets' combined influence value.  A player that exhausts Mecatol Rex casts 1 additional vote. Players cannot cast additional votes from other sources.\n\nAgainst: At the start of the next strategy phase, each player who voted \"Against\" or abstained exhausts all of their cultural planets and cannot choose the Politics strategy card unless it is the only unchosen strategy card."},{"n":"Research Grant Reallocation","t":"Directive","e":"Player","x":"Elect player.\n\nThe elected player researches any 1 non-faction technology.  The other player who cast the most votes for the elected player may spend 2 trade goods per prerequisite on that technology to gain that technology."},{"n":"Search Warrant","t":"Law","e":"Player","x":"Elect player.\n\nThe non-elected player who cast the most votes for the elected player places 1 of their control tokens on this card. The elected player gains this card and draws 2 secret objectives.\n\nThe owner of this card plays with their secret objectives revealed.  When the owner of this card would discard a secret objective, a player whose control token is on this card may take that secret objective instead."},{"n":"Seed of an Empire","t":"Directive","e":null,"x":"For: The player with the most victory points (speaker breaks ties) gains the speaker token and 1 victory point, then gives 1 promissory note to each other player who voted \"For\" (in order of most to least votes), if able.\n\nAgainst: The player with the least victory points (speaker breaks ties) gains 1 victory point, draws 3 action cards, and adds 1 command token from their reinforcements to each of their tactics, fleet, and strategy pools."},{"n":"Shared Research","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" may explore any frontier tokens in anomalies that contain their ships. During tactical actions, the active player may decide that any anomaly that does not contain a frontier token does not affect movement. \n\nAgainst: The player who cast the most votes \"For\" takes 1 command token from the reinforcements of each player who voted \"Against\" or abstained and places them in any number of anomaly systems."},{"n":"Swords to Plowshares","t":"Directive","e":null,"x":"For: Each player removes half of their infantry on each planet they control, rounding down. Each player gains trade goods equal to the number of their infantry removed. The player who cast the most votes \"For\" may explore each planet from which their infantry were removed.\n\nAgainst: The player who cast the most votes \"Against\" places 1 infantry from their reinforcements on each planet they control."},{"n":"Term Limits","t":"Law","e":null,"x":"For: The speaker places 1 of their control tokens on this card. When a player takes or receives the speaker token, they place 1 of their control tokens on this card. A player whose control token is on this card cannot take or receive the speaker token. If a control token from each player is on this card, remove them.\n\nAgainst: The player who cast the most votes \"Against\" draws 2 action cards. Exhaust the Politics strategy card. Players who voted \"Against\" or abstained must give 1 promissory note from their hand to a player who voted \"For,\" if able."},{"n":"Unconventional Measures","t":"Directive","e":null,"x":"For: Each player who voted \"For\" draws 2 action cards. Each player who voted \"Against\" gains 1 command token.\n\nAgainst: Each player who voted \"Against\" or abstained discards their action cards. The player who cast the most votes \"For\" chooses 1 strategy card to become exhausted."},{"n":"Wormhole Reconstruction","t":"Law","e":null,"x":"For: The player who cast the most votes \"For\" places 1 control token on this card.  Players may treat alpha wormholes as beta wormholes during movement, and vice versa. A player whose control token is on this card gains 1 commodity each time another player's ships move through an alpha or beta wormhole.\n\nAgainst: The player who cast the most votes \"For\" takes 1 command token from the reinforcements of each player who voted \"Against\" or abstained and places them into any number of systems that contain alpha or beta wormholes."},{"n":"Wormhole Research","t":"Directive","e":null,"x":"For: Players with ships in systems that contain 1 or more wormholes may research 1 technology with no more than 1 prerequisite per type of wormhole in those systems. The player who cast the most votes \"For\" may gain any 1 non-faction technology researched this way.\n\nAgainst: In systems that contain their ships and wormholes, each player who voted \"For\" destroys 1 non-fighter ship for each alpha or beta wormhole. Each player who voted \"Against\" or abstained removes 1 command token from their command sheet and returns it to their reinforcements."}];

 return `<div class="vdb cmp">${esOn()?`<div class="vdes ${p.es?'on':''}">Emergency Sessions: <b>${v.emergencySessionCount}</b> / 4</div>`:''}${p.st==='active'?`<div class="vdi">${p.kind==='exec'?'Executive Order agenda':'Agenda'}: <b>${Math.min(p.resolved+1,req)} / ${req}</b>${p.es?` <small>(2 + ${p.es} from Emergency Session${p.es>1?'s':''})</small>`:''}</div>`:''}<div class="vdi">Draw deck: <b>${v.agendaDrawDeck.length}</b> · Discard pile: <b>${v.agendaDiscardPile.length}</b></div>${pvEditBtn()}${v.esArea.length?'<div class="vdw">Emergency Session in play – one additional agenda is required.</div>':''}</div>`}
function vdActBar(m){const es=m==='res';
 return `<div class="act vdact"><span>${es?'<button disabled title="Emergency Session is not an agenda, so it cannot be vetoed">Veto</button>':'<button class="vdveto" onclick="vdVeto()">Veto</button>'}</span><span class="vdr">${es?'<button class="go" onclick="vdPlayES()">Play Emergency Session — Reveal Next Card</button>':'<button class="go" id="rb" disabled onclick="resolveAg()">Resolve Agenda</button>'}</span></div>`}
function vdResolvedScreen(){const v=S.vd,p=v.ph,A=$('app'),fin=p.resolved>=vdReq();let card='';
 if(p.resolved>0&&v.lastResolved!=null){const d=vdD(v.lastResolved);card=`<div class="panel" style="--tc:${TC[d.t]||'#9d98bd'}"><span class="tag">${esc(d.t)}</span><span class="tag" style="--tc:#fff">RESOLVED</span><div class="ttl">${esc(d.n)}</div><div class="txt">${esc(d.x)}</div><p class="stn">This card is now on top of the agenda discard pile.</p></div>`}
 const nxt=fin?`<button class="go" onclick="vdComplete()">${p.kind==='exec'?'Return to Action Phase':'Agenda Phase Complete'}</button>`:`<button class="go" ${p.empty?'disabled':''} onclick="vdNext()">Next Agenda</button>`;
 A.innerHTML=`${vdBanner()}<h2>${fin?'Agenda resolved':'Agenda resolved – next step'}</h2>${card}${p.empty&&!fin?`<div class="panel vdwarn"><b>The agenda draw deck is empty.</b> No further agenda can be drawn, and the discard pile is never recycled automatically.<div style="margin-top:.8rem"><button onclick="vdForceEnd()">End Agenda Phase Anyway</button></div></div>`:''}<div class="act vdact"><span></span><span class="vdr">${nxt}</span></div>`}
function vdNext(){const v=S.vd;if(!vdOn())return;const p=v.ph;if(p.st!=='active'||!p.awaiting||v.currentAgenda!=null||p.resolved>=vdReq())return;
 if(!v.agendaDrawDeck.length){p.empty=true;go();return}
 pushUndo();vdDraw();p.awaiting=false;p.empty=false;go()}
function vdComplete(force){const v=S.vd;if(!vdOn())return;const p=v.ph;if(p.st!=='active'||!p.awaiting||v.currentAgenda!=null)return;if(!force&&p.resolved<vdReq())return;
 pushUndo();addT();
 if(v.esArea.length){v.agendaDiscardPile.push(...v.esArea);v.esArea=[]}
 if(p.kind==='exec'){v.ph={st:'idle',kind:'agenda'};S.ag=null;S.step=3;S.view='action';go();return}
 p.st='done';S.ag=null;S.step=3;S.q='';newStrategy()}
function vdForceEnd(){if(VR)return;vrConfirm('End the Agenda Phase?','The agenda draw deck is empty, so the remaining required agenda cannot be drawn. End the Agenda Phase anyway?','Cancel','End Agenda Phase',()=>{vrEnd();vdComplete(true)})}
function vdResolved(){const v=S.vd,p=v.ph,id=v.currentAgenda;if(id==null||vdIsES(id))return;
 v.currentAgenda=null;v.agendaDiscardPile.push(id);v.lastResolved=id;p.resolved++;p.awaiting=true;p.empty=false;
 if(p.resolved>=p.base+p.es&&v.esArea.length){v.agendaDiscardPile.push(...v.esArea);v.esArea=[]}
 go()}
function vdPlayES(){const v=S.vd;if(!vdOn())return;const p=v.ph,id=v.currentAgenda;if(id==null||!vdIsES(id)||p.st!=='active')return;
 pushUndo();addT();v.currentAgenda=null;v.esArea.push(id);v.emergencySessionCount++;p.es++;
 if(!vdDraw()){p.awaiting=true;p.empty=true}
 go();toastMsg('Emergency Session played – next agenda revealed')}
function vdVeto(){if(VR||!vdOn())return;const v=S.vd;if(v.currentAgenda==null||vdIsES(v.currentAgenda))return;
 if(!v.agendaDrawDeck.length){vrMsg('Cannot Veto','The agenda draw deck is empty, so no replacement agenda can be drawn. The current agenda stays in play and nothing was changed.');return}
 vrConfirm('Veto this agenda?','The current agenda will be moved to the top of the discard pile without being resolved, and the next card will be drawn from the draw deck. Veto does not count as an Emergency Session.','Cancel','Veto Agenda',()=>{vrEnd();const w=S.vd;if(w.currentAgenda==null||vdIsES(w.currentAgenda)||!w.agendaDrawDeck.length)return;pushUndo();addT();const id=w.currentAgenda;w.currentAgenda=null;w.agendaDiscardPile.push(id);vdDraw();go()})}

/* ---- law / special effect tracking (works with and without the virtual deck) ---- */
function lawRecord(){const a=S.ag;if(!a)return;let c;try{c=calc()}catch(e){return}const w=c.win;if(!w)return;
 if(a.n==='Judicial Abolishment'&&S.dk==='orig'){const nmk=String(c.K[w]||'').trim().toLowerCase();S.laws=(S.laws||[]).filter(l=>l.n.toLowerCase()!==nmk)}
 if(a.t==='Law'&&a.n!=='Classified Document Leaks'&&(a.e||w==='for'||a.n==='Affirmation of Divine Right')){
  const own=a.e==='Player'?c.P.findIndex(p=>p.full.toLowerCase()===w):-1;
  S.laws=(S.laws||[]).filter(l=>l.n!==a.n);S.lid=(S.lid||0)+1;
  S.laws.push({id:S.lid,n:a.n,o:a.e?'Elected':(w==='for'?'For':'Against'),el:a.e?String(c.K[w]||''):'',own})}
 if(a.n==='New Constitution'&&w==='for')S.laws=[];
 if(a.n==='Ixthian Artifact'&&S.dk!=='orig')S.ixth=(w==='against')}
function agDone(){if(vdOn()&&S.vd.currentAgenda==null)return;
 pushUndo();lawRecord();agTally();addT();closeRes();S.used.add(S.ag.n);
 if(vdOn()){vdResolved();pvAfter();return}
 S.step=3;S.q='';go();pvAfter()}

/* ---- private windows ---- */

function vrShow(h){const m=vrEl();m.innerHTML=h;m.style.display='flex';m.scrollTop=0}
function vrEnd(){if(VR){clearInterval(VR.iv);VR.iv=null}VR=null;const m=$('vrm');if(m){m.innerHTML='';m.style.display='none'}}
function vdRestoreHold(){const v=S&&S.vd;if(v&&v.hold&&v.hold.length){v.agendaDrawDeck.unshift(...v.hold);v.hold=[]}}
function vrAbort(){vdRestoreHold();vrEnd()}
function vrCancel(){vdRestoreHold();vrEnd()}
function vrCount(sec,onTick,onDone){const end=Date.now()+sec*1000,me=VR;const tick=()=>{if(VR!==me)return;const left=Math.max(0,Math.ceil((end-Date.now())/1000));onTick(left);if(Date.now()>=end){clearInterval(me.iv);me.iv=null;onDone()}};clearInterval(me.iv);me.iv=setInterval(tick,200);tick()}
function vrMsg(t,b){if(VR)return;VR={kind:'msg'};vrShow(`<div class="vrb vrs"><div class="vrh2">${esc(t)}</div><p class="vrp">${esc(b)}</p><div class="vrbtn"><button class="go" onclick="vrEnd()">OK</button></div></div>`)}

function vrPrivacy(o){VR.kind='privacy';VR.go=o.go;vrShow(`<div class="vrb vrs"><div class="vrwarn">${esc(o.title)}</div><p class="vrp">${esc(o.text)}</p><div class="vrbtn"><button onclick="vrCancel()">Cancel</button><button class="go" onclick="VR&&VR.go&&VR.go()">${esc(o.btn||'Everyone Is Looking Away — Continue')}</button></div></div>`)}
const vrCard=(lab,id)=>{const d=vdD(id);return `<div class="vrcard" style="--tc:${TC[d.t]||'#9d98bd'}"><div class="vrlab">${esc(lab)}</div><span class="tag">${esc(d.t)}</span>${d.e?`<span class="tag" style="--tc:#fff">Elect: ${esc(d.e)}</span>`:''}<div class="vrname">${esc(d.n)}</div><div class="vrtxt">${esc(d.x)}</div></div>`};
function vrRevealWin(title,cards,sec,after){VR.kind='reveal';VR.stage='reveal';
 vrShow(`<div class="vrb vrr"><div class="vrhd"><div class="vrwarn sm">${esc(title)}</div><div class="vrclk"><span id="vrn">${sec}</span><small>seconds</small></div></div><div class="vrcs c${cards.length}">${cards.join('')}</div><div class="vrbtn"><button onclick="VR&&VR.fin&&VR.fin()">${after.btn}</button></div></div>`);
 let done=false;const fin=()=>{if(done)return;done=true;after.fn()};VR.fin=fin;
 vrCount(sec,l=>{const e=$('vrn');if(e)e.textContent=l},fin)}
/* Top / bottom two */

 vrConfirm('Inspect the '+nm+' two agenda cards?','Are you sure you want to privately inspect the '+nm+' two agenda cards? Other players must look away.','Cancel','Confirm',()=>{VR.ok=null;vrPrivacy({title:'PRIVATE ACTION — LOOK AT '+nm.toUpperCase()+' 2 AGENDA CARDS',text:'All other players must close their eyes or look away from the screen. Confirm that everyone else is looking away before continuing.',go:()=>vdPeekGo(which)})})}

 const cs=which==='top'?[vrCard('Card 1 – top card',d[0]),vrCard('Card 2 – second from top',d[1])]:[vrCard('Card 1 – second from bottom',d[n-2]),vrCard('Card 2 – bottom card',d[n-1])];

/* Insider Information */
function vdInsider(){if(VR||!vdOn())return;if(!S.vd.agendaDrawDeck.length){vrMsg('Agenda deck is empty','There is no top card to look at because the agenda draw deck is empty.');return}
 VR={kind:'dlg'};vrPrivacy({title:'PRIVATE ACTION — INSIDER INFORMATION',text:'Other players must close their eyes or look away from the screen.',btn:'Everyone Is Looking Away — Start 5-Second Countdown',go:vdInsiderCount})}
function vdInsiderCount(){VR.kind='count';
 vrShow(`<div class="vrb vrs"><div class="vrwarn">PRIVATE ACTION — INSIDER INFORMATION</div><p class="vrp">Other players must close their eyes or look away from the screen.</p><div class="vrbig" id="vrn">5</div><p class="vrp">The card is revealed when the countdown reaches zero.</p><div class="vrbtn"><button onclick="vrCancel()">Cancel</button></div></div>`);
 vrCount(5,l=>{const e=$('vrn');if(e)e.textContent=l},()=>{const d=S.vd.agendaDrawDeck;if(!d.length){vrEnd();vrMsg('Agenda deck is empty','There is no top card to look at.');return}

/* Politics */
function vdPolitics(){if(VR||!vdOn())return;const n=S.vd.agendaDrawDeck.length;
 if(n<2){vrMsg('Not enough cards','Politics needs at least 2 cards in the agenda draw deck, but it holds '+n+'. Nothing was changed.');return}
 VR={kind:'dlg'};vrPrivacy({title:'PRIVATE ACTION — POLITICS PLAYER ONLY',text:'All other players must close their eyes or look away from the screen. The Politics player should confirm that everyone else is looking away before continuing.',go:vdPolReveal})}
function vdPolReveal(){const v=S.vd;if(v.agendaDrawDeck.length<2||v.hold.length){vrEnd();vrMsg('Not enough cards','Politics needs 2 cards in the agenda draw deck.');return}
 pushUndo();const a=v.agendaDrawDeck.shift(),b=v.agendaDrawDeck.shift();v.hold=[a,b];VR.pol=true;
 vrRevealWin('PRIVATE — POLITICS: CARDS 1 AND 2',[vrCard('Card 1',a),vrCard('Card 2',b)],30,{btn:'Done Looking — Choose Placement',fn:vdPolPlace})}
function vdPolPlace(){if(!VR||!VR.pol)return;clearInterval(VR.iv);VR.iv=null;VR.fin=null;VR.stage='place';VR.pl={s:[null,null],top:1,bot:1};vdPolDraw()}
function vdPolOrder(){const p=VR.pl,[a,b]=p.s;if(a==null||b==null)return null;
 if(a==='top'&&b==='top')return{tops:p.top===1?[0,1]:[1,0],bots:[]};
 if(a==='bottom'&&b==='bottom')return{tops:[],bots:p.bot===1?[0,1]:[1,0]};
 return a==='top'?{tops:[0],bots:[1]}:{tops:[1],bots:[0]}}
function vdPolSet(k,s){if(!VR||VR.stage!=='place')return;VR.pl.s[k]=s;vdPolDraw()}
function vdPolOrd(k,v){if(!VR||VR.stage!=='place')return;VR.pl[k]=v;vdPolDraw()}
function vdPolDraw(){const p=VR.pl,o=vdPolOrder(),rest=S.vd.agendaDrawDeck.length,[a,b]=p.s;
 const blk=k=>`<div class="vpc"><div class="vpn">Card ${k+1}</div><div class="vpo"><button class="${p.s[k]==='top'?'sel':''}" onclick="vdPolSet(${k},'top')">Top of the deck</button><button class="${p.s[k]==='bottom'?'sel':''}" onclick="vdPolSet(${k},'bottom')">Bottom of the deck</button></div></div>`;
 let ord='';
 if(a==='top'&&b==='top')ord=`<div class="vpd"><b>Which card is drawn first?</b><div class="vpo"><button class="${p.top===1?'sel':''}" onclick="vdPolOrd('top',1)">Card 1 first, then Card 2</button><button class="${p.top===2?'sel':''}" onclick="vdPolOrd('top',2)">Card 2 first, then Card 1</button></div></div>`;
 if(a==='bottom'&&b==='bottom')ord=`<div class="vpd"><b>Order at the bottom (the lower card is the very last card of the deck)</b><div class="vpo"><button class="${p.bot===1?'sel':''}" onclick="vdPolOrd('bot',1)">Card 1 above Card 2</button><button class="${p.bot===2?'sel':''}" onclick="vdPolOrd('bot',2)">Card 2 above Card 1</button></div></div>`;
 const chip=i=>`<span class="vch">Card ${i+1}</span>`,mid=`<span class="vch mid">… ${rest} other card${rest===1?'':'s'} …</span>`;
 const prev=o?`<div class="vpr"><small>Resulting deck order, top → bottom</small><div class="vpl">${o.tops.map(chip).join('')}${mid}${o.bots.map(chip).join('')}</div>${o.tops.length?`<small>Next card drawn: Card ${o.tops[0]+1}</small>`:'<small>Neither card is on top – the next card drawn is one of the other cards.</small>'}</div>`:'<div class="vpr"><small>Choose a placement for both cards.</small></div>';
 vrShow(`<div class="vrb vrp2"><div class="vrh2">Politics — choose placement</div><p class="vrp">The cards are no longer shown. Assign each card to the top or the bottom of the agenda draw deck.</p><div class="vpg">${blk(0)}${blk(1)}</div>${ord}${prev}<div class="vrbtn"><button onclick="vrCancel()">Cancel (restore original order)</button><button class="go" ${o?'':'disabled'} onclick="vdPolConfirm()">Confirm Placement</button></div></div>`)}
function vdPolConfirm(){if(!VR||VR.stage!=='place')return;const v=S.vd,o=vdPolOrder();if(!o||v.hold.length!==2)return;
 const m=v.hold.slice();v.agendaDrawDeck=[...o.tops.map(i=>m[i]),...v.agendaDrawDeck,...o.bots.map(i=>m[i])];v.hold=[];vrEnd();toastMsg('Politics action complete – the agenda deck has been reordered.')}
/* Shuffle and discard view */
function vdShuffle(){if(VR||!vdOn())return;if(!S.vd.agendaDrawDeck.length){vrMsg('Draw deck is empty','There are no cards in the agenda draw deck to shuffle.');return}
 vrConfirm('Shuffle the agenda draw deck?','Are you sure you want to shuffle the remaining agenda draw deck? This will change the order of the cards.','Cancel','Shuffle Deck',()=>{vrEnd();pushUndo();vdShuf(S.vd.agendaDrawDeck);toastMsg('Agenda draw deck shuffled.')})}
function vdDiscard(){if(VR||!vdOn())return;const pile=S.vd.agendaDiscardPile,n=pile.length;VR={kind:'view'};
 const act=new Set((S.laws||[]).map(l=>l.n));
 const rows=pile.map((id,i)=>[id,i]).reverse().map(([id,i])=>{const d=vdD(id),top=i===n-1;return `<div class="vrcard dc ${top?'top':''}" style="--tc:${TC[d.t]||'#9d98bd'}"><div class="vrlab">Position ${i+1} of ${n}${top?' — TOP CARD OF THE DISCARD PILE':''}</div><span class="tag">${esc(d.t)}</span>${act.has(d.n)?'<span class="tag" style="--tc:#fff">Law in play</span>':''}<div class="vrname">${esc(d.n)}</div><div class="vrtxt">${esc(d.x)}</div></div>`}).join('');
 vrShow(`<div class="vrb vrr"><div class="vrhd"><div class="vrh2" style="margin:0">Agenda discard pile (${n} card${n===1?'':'s'})</div></div><p class="vrp">Read-only view, newest card first. Nothing here can be moved or changed.</p>${n?`<div class="vrcs c1">${rows}</div>`:'<p class="vrp"><b>The discard pile is empty.</b></p>'}<div class="vrbtn"><button class="go" onclick="vrEnd()">Close</button></div></div>`)}

/* ---- Laws window ---- */
var LW={pend:null,add:false,sel:'',o:'For',el:'',own:''};
function lawsOpen(){let m=$('lwm');if(!m){m=document.createElement('div');m.id='lwm';m.className='mo';m.onclick=e=>{if(e.target===m)lawsClose()};document.body.appendChild(m)}LW.pend=null;LW.add=false;lawsDraw();m.style.display='flex'}
function lawsClose(){const m=$('lwm');if(m)m.style.display='none'}
const lawOwner=l=>l.own>=0&&S.f[l.own]>=0?F[S.f[l.own]][1]:'';
function lawText(d,l){const hl=l.o==='For'?'For:':l.o==='Against'?'Against:':null;return d.x.split(/\n\n/).map(p=>{const on=hl&&p.startsWith(hl);return `<p class="lwp ${on?'on':''}">${esc(p)}${on?' <em>← active outcome</em>':''}</p>`}).join('')}
function lawsDraw(){const m=$('lwm');if(!m)return;const L=S.laws||[];
 const cards=L.map(l=>{const d=D.find(x=>x.n===l.n);if(!d)return '';const own=lawOwner(l),elf=l.el?(F.find(f=>f[0]===l.el)||[0,l.el])[1]:'';
  return `<div class="lwc"><div class="lwh"><b>${esc(l.n)}</b><span class="tag" style="--tc:${TC.Law}">Law</span><span class="lwa">● Active</span></div><div class="lwm">Outcome: <b>${l.o==='Elected'?'Elected':esc(l.o)}</b>${elf?` · Elected: <b>${esc(elf)}</b>`:''}${own?` · Owner / affected player: <b style="color:${pcol(l.own)}">${esc(own)}</b>`:''}</div><div class="lwt">${lawText(d,l)}</div>${LW.pend===l.id?`<div class="lwr">Remove this law from the active list? <button onclick="LW.pend=null;lawsDraw()">Cancel</button><button class="go" onclick="lawRepeal(${l.id})">Repeal Law</button></div>`:`<div class="lwr"><button onclick="LW.pend=${l.id};lawsDraw()">Repeal / discard this law</button></div>`}</div>`}).join('');
 let add='';
 if(LW.add){const cand=D.filter(d=>d.t==='Law'&&!L.some(l=>l.n===d.n)),a=D.find(d=>d.n===LW.sel);
  add=`<div class="lwadd"><select onchange="LW.sel=this.value;LW.o='For';LW.el='';LW.own='';lawsDraw()"><option value="">Choose law…</option>${cand.map(d=>`<option ${LW.sel===d.n?'selected':''}>${esc(d.n)}</option>`).join('')}</select>${a&&a.e==='Player'?`<select onchange="LW.own=this.value"><option value="">Elected player…</option>${S.f.map((x,i)=>`<option value="${i}" ${LW.own===String(i)?'selected':''}>${esc(fvKey(x,F[x][1]))}</option>`).join('')}</select>`:''}${a&&a.e&&a.e!=='Player'?`<input type="text" placeholder="Elected ${esc(a.e)}…" value="${esc(LW.el)}" oninput="LW.el=this.value">`:''}${a&&!a.e&&a.n==='Affirmation of Divine Right'?`<select onchange="LW.o=this.value"><option ${LW.o==='For'?'selected':''}>For</option><option ${LW.o==='Against'?'selected':''}>Against</option></select>`:''}<button class="go" onclick="lawAdd()">Add Law</button><button onclick="LW.add=false;lawsDraw()">Cancel</button></div>`}
 const sp=S.ixth?`<div class="lwc sp"><div class="lwh"><b>Ixthian Artifact</b><span class="tag" style="--tc:#7fd6ff">Directive</span><span class="lwa">● Remains on Mecatol Rex</span></div><div class="lwm">The artifact stays attached to the Mecatol Rex planet card (outcome: Against). This is a directive effect, <b>not a law</b>.</div><div class="lwt"><p class="lwp on">The player who controls Mecatol Rex gains 1 victory point, and loses 1 victory point if they lose control of Mecatol Rex.</p>${S.hold&&S.hold[3]!=null&&S.f[S.hold[3]]>=0?`<p class="lwp">Current holder in the Action Phase tracker: <b style="color:${pcol(S.hold[3])}">${esc(F[S.f[S.hold[3]]][1])}</b></p>`:'<p class="lwp">No holder is set in the Action Phase tracker yet (use the Ixthian Artifact selector at the top).</p>'}</div><div class="lwr"><button onclick="lawIxth(false)">Clear this reminder</button></div></div>`:`<p class="lwempty">No special agenda effects are active.</p><div class="lwr"><button onclick="lawIxth(true)">Mark Ixthian Artifact as remaining on Mecatol Rex</button></div>`;
 m.innerHTML=`<div class="mb sw lwb"><div class="mh"><h3>Laws</h3><button onclick="lawsClose()">✕ Close</button></div><div class="lwsec">Active Laws (${L.length})</div>${cards||'<p class="lwempty">No laws are currently active.</p>'}${add}${LW.add?'':'<div class="lwr"><button onclick="LW.add=true;LW.sel=\'\';lawsDraw()">＋ Add a law manually</button></div>'}<div class="lwsec">Special Agenda Effects</div>${sp}<p class="stn">Laws are recorded when an agenda is resolved with a law-keeping outcome. Repealed or discarded laws are not listed.</p></div>`}
function lawRepeal(id){pushUndo();S.laws=(S.laws||[]).filter(l=>l.id!==id);LW.pend=null;lawsDraw()}
function lawAdd(){const a=D.find(d=>d.n===LW.sel);if(!a)return;if(a.e==='Player'&&LW.own==='')return;pushUndo();S.lid=(S.lid||0)+1;
 S.laws=(S.laws||[]).filter(l=>l.n!==a.n);S.laws.push({id:S.lid,n:a.n,o:a.e?'Elected':(LW.o||'For'),el:a.e==='Player'&&LW.own!==''?F[S.f[+LW.own]][0]:(a.e?LW.el.trim():''),own:a.e==='Player'&&LW.own!==''?+LW.own:-1});LW.add=false;lawsDraw()}

<script>
/* ===== UI animation layer: modal close, row moves, score pulse, new cards ===== */
(function(){
 const root=document.documentElement,on=()=>!root.classList.contains('noanim');
 /* modal close: keep the box visible for a moment with a class while the inline display stays none */
 new MutationObserver(ms=>{for(const m of ms){const t=m.target;if(!t.classList||!(t.classList.contains('mo')||t.classList.contains('smo')))continue;
  const d=t.style.display;if(d===t._d)continue;const prev=t._d;t._d=d;
  if(d==='none'){if(prev&&prev!=='none'&&on()){t.classList.add('mo-out');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('mo-out'),150)}}
  else{clearTimeout(t._tm);t.classList.remove('mo-out')}}}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['style']});
 const zoom=()=>parseFloat(root.style.zoom)||1,ease='cubic-bezier(.2,.8,.2,1)';
 function snap(){const r={rows:{},oc:new Set(),scx:new Set(),n:0};
  document.querySelectorAll('.sbr').forEach(e=>{const b=e.querySelector('b'),em=e.querySelector('em');if(!b)return;r.n++;r.rows[b.textContent]={y:e.getBoundingClientRect().top,v:em?em.textContent:'',pas:e.classList.contains('pas')}});
  document.querySelectorAll('.oc').forEach(e=>r.oc.add(e.textContent.trim().slice(0,40)));
  document.querySelectorAll('.scx').forEach(e=>r.scx.add(e.textContent));return r}
 function play(r){if(!on()||!r.n)return;const z=zoom();
  document.querySelectorAll('.sbr').forEach(e=>{const b=e.querySelector('b'),em=e.querySelector('em'),p=b&&r.rows[b.textContent];if(!p)return;
   const dy=(p.y-e.getBoundingClientRect().top)/z;if(Math.abs(dy)>3)e.animate([{transform:'translateY('+dy+'px)'},{transform:'none'}],{duration:280,easing:ease});
   if(em&&p.v!==em.textContent){em.style.display='inline-block';em.animate([{transform:'scale(1.35)',textShadow:'0 0 .8rem var(--gold)'},{transform:'none',textShadow:'0 0 0 transparent'}],{duration:450,easing:'cubic-bezier(.2,1.4,.4,1)'})}
   if(!p.pas&&e.classList.contains('pas'))e.animate([{filter:'brightness(2)'},{filter:'none'}],{duration:400,easing:'ease-out'})});
  document.querySelectorAll('.oc').forEach(e=>{if(!r.oc.has(e.textContent.trim().slice(0,40)))e.animate([{opacity:0,transform:'translateY(.6rem) scale(.98)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'})});
  document.querySelectorAll('.scx').forEach(e=>{if(!r.scx.has(e.textContent))e.animate([{opacity:1},{opacity:.55}],{duration:350})})}
 function fade(el){if(on()&&el)try{el.animate([{opacity:0,transform:'translateY(.5rem)'},{opacity:1,transform:'none'}],{duration:220,easing:'ease-out'})}catch(e){}}
 const ra=window.renderAction,go0=window.go;let lastA=null,lastG=null;
 if(typeof ra==='function')window.renderAction=function(){const r=snap(),k='a'+(S.stat?1:0);const ch=lastA!==null&&lastA!==k&&lastG==='action';lastA=k;const out=ra.apply(this,arguments);play(r);if(ch)fade(document.getElementById('app'));return out};
 if(typeof go0==='function')window.go=function(){const k=S.step+':'+S.view;const ch=k!==lastG;lastG=S.view==='action'?'action':k;if(S.view!=='action')lastA=null;const out=go0.apply(this,arguments);if(ch)fade(document.getElementById('app'));return out};
})();
</script>
<script>
/* ===== faction logos next to faction names in text + drag resize ===== */
(function(){
const SK=new Map();
F.forEach(f=>{[f[0],f[0].replace(/^The /,''),f[1]].forEach(n=>{if(n&&!SK.has(n))SK.set(n,f[1])})});
SK.set('The Firmament','Firmament');SK.set('The Obsidian','Obsidian');SK.set('Obsidian','Obsidian');
const alt=[...SK.keys()].sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
const RX=new RegExp('(?<![A-Za-z0-9])(?:'+alt+')(?![A-Za-z0-9])','g');
const SKIP='script,style,textarea,input,select,option,#list,[data-nofl]';
function logoBefore(t){let n=t,d=0;while(n&&d<4){let p=n.previousSibling;while(p&&p.nodeType===3&&!p.nodeValue.trim())p=p.previousSibling;if(p)return p.nodeType===1&&p.classList.contains('flg');n=n.parentNode;d++}return false}
function proc(t){const s=t.nodeValue;if(!s||s.length<2||!t.parentNode)return;RX.lastIndex=0;let m,last=0,frag=null;const lb=logoBefore(t);
 while((m=RX.exec(s))){const k=SK.get(m[0]),src=k&&FLG[k];if(!src)continue;if(lb&&/^[\s\d.\-–:·(]*$/.test(s.slice(0,m.index)))continue;
  frag=frag||document.createDocumentFragment();
  if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
  const im=document.createElement('img');im.className='flg fl-in';im.src=src;im.alt='';im.draggable=false;frag.appendChild(im);
  frag.appendChild(document.createTextNode(m[0]));last=m.index+m[0].length}
 if(frag){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));t.parentNode.replaceChild(frag,t)}}
function walk(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!n.parentElement.closest(SKIP)?1:2}),L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(proc)}
const CFG={childList:true,subtree:true,characterData:true};let q=new Set(),sch=false;
const obs=new MutationObserver(rs=>{rs.forEach(r=>{if(r.type==='characterData')q.add(r.target);else r.addedNodes.forEach(n=>q.add(n))});if(!sch){sch=true;requestAnimationFrame(run)}});
function run(){sch=false;obs.disconnect();try{q.forEach(n=>{if(!n.isConnected)return;if(n.nodeType===3){if(n.parentElement&&!n.parentElement.closest(SKIP))proc(n)}else if(n.nodeType===1&&!n.closest(SKIP))walk(n)})}catch(e){console.error(e)}finally{q.clear();obs.observe(document.body,CFG)}}
walk(document.body);obs.observe(document.body,CFG);

})();
</script>
